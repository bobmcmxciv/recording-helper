name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test server/test/*.test.js

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Unit tests and debug APK
        working-directory: app-android
        run: gradle testStandardDebugUnitTest assembleStandardDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: recording-helper-debug-apk
          path: app-android/app/build/outputs/apk/standard/debug/*.apk
