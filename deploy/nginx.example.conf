# Example nginx site: the hub under /recording-helper/ and model files under /recording-models/.
# Replace your-domain.example and the certificate paths with your own.

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.example;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name your-domain.example;

    ssl_certificate     /etc/letsencrypt/live/your-domain.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.example/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Sync hub. The trailing slash on proxy_pass strips the /recording-helper/ prefix.
    location = /recording-helper {
        return 301 /recording-helper/;
    }
    location /recording-helper/ {
        proxy_pass http://127.0.0.1:8788/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The hub accepts sync batches up to 10 MB.
        client_max_body_size 11m;
        proxy_read_timeout 60s;
    }

    # Static model files for the app (optional, any static HTTPS host works).
    location /recording-models/ {
        alias /srv/recording-models/;
        autoindex off;
        types {
            application/json json;
            application/octet-stream bin onnx gguf;
            application/zip zip;
            application/x-bzip2 bz2;
            application/gzip gz tgz;
        }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options nosniff;
    }
}
